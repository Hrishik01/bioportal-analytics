version: 2

models:
  - name: dim_customers
    description: One row per customer with lifetime order and engagement rollups.
    columns:
      - name: customer_id
        description: Primary key.
        tests: [unique, not_null]
      - name: segment
        description: Customer type (Biotech, Pharma, CDMO, Academic).
      - name: is_active_90d
        description: True if the customer completed an order in the 90 days before the as_of_date var.

  - name: dim_products
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: fct_orders
    description: One row per order. The single source of truth for revenue and order counts.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: recognized_revenue
        description: Net revenue for completed orders only (cancelled and returned orders count as zero).
      - name: cancelled_or_returned_order
        description: 1 if the order was cancelled or returned, else 0. Numerator of the cancellation_rate metric.
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false
    tests:
      - dbt_utils.expression_is_true:
          expression: "net_revenue <= gross_revenue"

  - name: fct_sessions
    description: One row per portal session, with funnel flags.
    columns:
      - name: session_id
        tests: [unique, not_null]

  - name: fct_experiment_results
    description: Control-vs-treatment readout for each experiment, including lift and z-score.
    columns:
      - name: experiment_id
        tests: [unique, not_null]
      - name: control_cancellation_rate
        description: Guardrail. Cancelled + returned orders / all orders placed by control customers in the window.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: treatment_cancellation_rate
        description: Guardrail. Same definition, treatment arm.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: cancellation_rate_lift
        description: treatment minus control cancellation rate, in absolute points. Positive = treatment is worse.
      - name: is_guardrail_breached
        description: True if cancellation_rate_lift exceeds the guardrail_max_cancellation_increase var.
        tests: [not_null]

  - name: fct_customer_retention
    description: >
      Signup-month cohort retention. One row per cohort and month offset 0-6 (month 0 = signup month).
      A customer is retained in a month if they placed at least one completed order in it.
      retention_rate is NULL for months that cannot be observed: after the as_of_date var, or before the first month of order history.
    columns:
      - name: cohort_month
        description: First day of the month the customers signed up in.
        tests: [not_null]
      - name: months_since_signup
        description: Calendar months after the signup month (0 = signup month).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 6
      - name: cohort_size
        description: Customers who signed up in the cohort month.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: retained_customers
        description: Customers in the cohort with a completed order in that month.
        tests: [not_null]
      - name: retention_rate
        description: retained_customers / cohort_size; NULL when the month is outside the observable order history.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cohort_month, months_since_signup]
      - dbt_utils.expression_is_true:
          expression: "retained_customers <= cohort_size"
